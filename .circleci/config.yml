
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    steps:
      - checkout

      - run:
          name: Build Android APK
          command: ./gradlew assembleDebug

      - run:
          name: Run Unit Tests
          command: ./gradlew testDebugUnitTest

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

workflows:
  android-build:
    jobs:
      - build
